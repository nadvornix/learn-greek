<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;

        }

            }

            h1 {

                margin-bottom: 30px;
            }

            .greek-word {

                min-height: 100px;
                margin: 30px 0;
            }

            .transliteration {
                font-size: 1.5em;
            }

            .spelling {
                font-size: 1em;
            }

            .explanation {
                font-size: 1em;
            }
        }

            margin-bottom: 40px;
            font-size: 2.5em;
        }

            color: #2d3748;
            margin: 40px 0;

            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .greek-word.font-1 { font-family: 'Noto Serif', serif; }
        .greek-word.font-2 { font-family: 'GFS Didot', serif; }
        .greek-word.font-3 { font-family: Georgia, serif; }
        .greek-word.font-4 { font-family: 'Times New Roman', serif; }
        .greek-word.font-5 { font-family: 'Palatino', serif; }
        .greek-word.font-6 { font-family: 'Playfair Display', serif; font-weight: 700; }
        .greek-word.font-7 { font-family: 'Crimson Text', serif; }
        .greek-word.font-8 { font-family: 'EB Garamond', serif; }
        .greek-word.font-9 { font-family: 'Libre Baskerville', serif; font-weight: 700; }
        .greek-word.font-10 { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
        .greek-word.font-11 { font-family: 'Cormorant Garamond', serif; }
        .greek-word.font-12 { font-family: 'Spectral', serif; }
        .greek-word.font-13 { font-family: 'Merriweather', serif; font-weight: 700; }

        .transliteration {
            font-size: 2em;
            color: #667eea;
            margin: 20px 0;
            min-height: 60px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
        }

        .transliteration.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .audio-container {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .audio-btn {
            background: none;
            color: #667eea;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            transition: all 0.2s ease;
            position: relative;
            padding: 0;
            opacity: 0.6;
        }

        .audio-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        .audio-btn .tooltip {
            visibility: hidden;
            background-color: #4a5568;
            color: white;
            text-align: center;
            padding: 8px 12px;
            border-radius: 6px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .audio-btn .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #4a5568 transparent transparent transparent;
        }

        .audio-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .audio-btn {
                font-size: 0.9em;
            }
        }

        .spelling {
            font-size: 1.1em;
            color: #805ad5;
            margin: 15px 0;
            padding: 15px;
            background: #faf5ff;
            border-radius: 8px;
            min-height: 50px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
            font-style: italic;
        }

        .spelling.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .explanation {
            font-size: 1.2em;
            color: #4a5568;
            margin: 20px 0;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            min-height: 80px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
        }

        .explanation.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .hint {
            color: #a0aec0;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .navigation {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            position: relative;
        }

        .prev-link {
            position: absolute;
            left: 0;
            color: #a0aec0;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s ease;
            padding: 5px 10px;
        }

        .prev-link:hover {
            color: #667eea;
        }

        .prev-link:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }


        @media (max-width: 768px) {
            .prev-link {
                font-size: 0.8em;
            }
        }
    </style>
</head>

        function speakGreek() {
            if (!currentWord) return;

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            // Create utterance with the Greek word
            const utterance = new SpeechSynthesisUtterance(currentWord.greek);

            'Α': 'Alpha', 'α': 'alpha',

        function normalizeGreekChar(char) {
            // Remove diacritical marks by normalizing to NFD and removing combining characters
            return char.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function getLetterSpelling(word) {
            const letters = [];
            for (let char of word) {
                const normalized = normalizeGreekChar(char);
                if (greekLetterNames[normalized]) {
                    letters.push(greekLetterNames[normalized]);
                }
            }
            return letters.join(' - ');
        }

        function getRandomFont() {
            const fonts = ['font-1', 'font-2', 'font-3', 'font-4', 'font-5', 'font-6', 'font-7', 'font-8', 'font-9', 'font-10', 'font-11', 'font-12', 'font-13', 'font-14', 'font-15', 'font-16'];
            return fonts[Math.floor(Math.random() * fonts.length)];
        }

        function getRandomCase(word) {
            const randomChoice = Math.random();
            if (randomChoice < 0.33) {
                return word.toUpperCase();
            } else if (randomChoice < 0.66) {
                return word.toLowerCase();
            } else {
                return word; // Keep original mixed case
            }
        }

        function getNextWord() {
            if (usedIndices.length === greekWords.length) {
                usedIndices = [];
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * greekWords.length);
            } while (usedIndices.includes(randomIndex));

            usedIndices.push(randomIndex);
            currentIndex = usedIndices.length - 1;
            return greekWords[randomIndex];
        }

        function getPreviousWord() {
            if (currentIndex > 0) {
                currentIndex--;
                return greekWords[usedIndices[currentIndex]];
            }
            return null;
        }

        function goToNext() {
            if (revealed) {
                displayWord();
            } else {
                revealAnswer();
            }
        }

        function goToPrevious() {
            if (currentIndex > 0) {
                const prevWord = getPreviousWord();
                if (prevWord) {
                    currentWord = prevWord;
                    revealed = true;
                    displayCurrentWord();
                    revealAnswer();
                }
            }
        }

        function displayCurrentWord() {
            // Remove old font class
            greekWordEl.className = 'greek-word';

            // Add new random font
            currentFontClass = getRandomFont();
            greekWordEl.classList.add(currentFontClass);

            // Display word with random case
            greekWordEl.textContent = getRandomCase(currentWord.greek);

            // Hide transliteration, spelling, and explanation initially
            transliterationTextEl.textContent = '';
            audioContainerEl.style.display = 'none';
            transliterationEl.classList.remove('revealed');
            spellingEl.textContent = '';
            spellingEl.classList.remove('revealed');
            explanationEl.textContent = '';
            explanationEl.classList.remove('revealed');

            // Update navigation buttons
            prevBtn.disabled = currentIndex === 0;
        }

        function displayWord() {
            currentWord = getNextWord();
            revealed = false;

            displayCurrentWord();

            // Update button
            actionBtn.textContent = 'Reveal';
        }

        function revealAnswer() {
            revealed = true;
            transliterationTextEl.textContent = currentWord.transliteration;
            audioContainerEl.style.display = 'inline-flex';
            transliterationEl.classList.add('revealed');
            spellingEl.textContent = getLetterSpelling(currentWord.greek);
            spellingEl.classList.add('revealed');
            explanationEl.textContent = currentWord.explanation;
            explanationEl.classList.add('revealed');
            actionBtn.textContent = 'Next Word';

            // Show Previous link after first reveal
            if (currentIndex >= 0) {
                prevBtn.style.display = 'block';
            }
        }

        function handleAction() {
            if (!revealed) {
                revealAnswer();
            } else {
                displayWord();
            }
        }

        // Event listeners
        actionBtn.addEventListener('click', handleAction);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                handleAction();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrevious();
            }
        });

        // Touch/swipe support for mobile
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left - go to next
                    goToNext();
                } else {
                    // Swipe right - go to previous
                    goToPrevious();
                }
            }
        }

        // Initialize with first word
        displayWord();
    </script>
</body>
</html>
